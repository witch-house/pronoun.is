# Use the latest 2.1 version of CircleCI pipeline process engine.
# See: https://circleci.com/docs/reference/configuration-reference
version: 2.1

# Define a job to be invoked later in a workflow.
# See: https://circleci.com/docs/guides/orchestrate/jobs-steps/#jobs-overview & https://circleci.com/docs/reference/configuration-reference/#jobs
jobs:
  test:
    docker:
      - image: cimg/clojure:1.12
    steps:
      - checkout
      - run:
          name: Run unit tests
          command: lein check && lein test

  integration-test:
    docker:
      - image: cimg/clojure:1.12
    steps:
      - checkout
      - run:
          name: Start server
          command: lein ring server &> server.log
          background: true
      - run:
          name: Wait for server
          command: sleep 15 && curl -s http://localhost:3000 > /dev/null || (echo "Server failed to start" && cat server.log && exit 1)
      - run:
          name: Run integration test
          command: curl -s http://localhost:3000 | grep -q '<a href="all-pronouns">' || (echo "Front page spot-check failed" && exit 1)

# Orchestrate jobs using workflows
# See: https://circleci.com/docs/guides/orchestrate/workflows/ & https://circleci.com/docs/reference/configuration-reference/#workflows
workflows:
  test-workflow:
    jobs:
      - test
      - integration-test:
          requires:
            - test
